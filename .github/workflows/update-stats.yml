name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Tous les jours à minuit (UTC)
  workflow_dispatch: # Permet de le lancer à la main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # ---------- Carte stats ----------
      - name: Stats card (private + public, with PAT)
        id: stats_pat
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Stats card (public only, fallback)
        if: steps.stats_pat.outcome == 'failure'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Carte langages ----------
      - name: Top languages card (private + public, with PAT)
        id: langs_pat
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages card (public only, fallback)
        if: steps.langs_pat.outcome == 'failure'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Alerte ----------
      - name: Warn if the PAT failed
        if: steps.stats_pat.outcome == 'failure' || steps.langs_pat.outcome == 'failure'
        run: echo "::warning::STATS_TOKEN a échoué (expiré, révoqué ou absent). Cartes générées avec les stats publiques uniquement."

      # ---------- Commit ----------
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
